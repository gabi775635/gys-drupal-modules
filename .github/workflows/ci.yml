name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    name: "PHPUnit"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  benchmark:
    name: "Performance benchmarks"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          extensions: mbstring

      # Télécharge la baseline de la branche principale (si elle existe)
      - name: Download baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: perf-baseline
          path: tests/perf/
        continue-on-error: true

      - name: Run benchmarks
        run: php -d error_reporting=E_ERROR tests/benchmark.php --compare

      - name: Save baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        run: php -d error_reporting=E_ERROR tests/benchmark.php --baseline

      - name: Upload baseline artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-baseline
          path: tests/perf/baseline.json
          retention-days: 90

  phpcs:
    name: "PHPCS Drupal"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml, curl

      - name: Install Drupal Coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require drupal/coder squizlabs/php_codesniffer
          ~/.composer/vendor/bin/phpcs --config-set installed_paths ~/.composer/vendor/drupal/coder/coder_sniffer

      - name: Run PHPCS
        run: |
          ~/.composer/vendor/bin/phpcs \
            --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install \
            --report=checkstyle \
            --report-file=phpcs-report.xml \
            modules/ || true
          # Crée un rapport vide si aucun fichier scanné
          if [ ! -f phpcs-report.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><checkstyle version="3.5.8"></checkstyle>' > phpcs-report.xml
          fi

      - name: Upload PHPCS report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phpcs-report
          path: phpcs-report.xml

  drupal-integration:
    name: "Drupal integration"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer, drush
          extensions: mbstring, xml, pdo_sqlite, gd

      # Installe un Drupal 10 minimal dans un dossier séparé
      - name: Create Drupal project
        run: |
          composer create-project drupal/recommended-project:^10 drupal-test \
            --no-interaction --no-install --prefer-dist
          cd drupal-test
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer require drush/drush --no-interaction --prefer-dist
          composer install --no-interaction --prefer-dist

      # Copie les modules custom dans l'arborescence Drupal
      - name: Install custom modules
        run: |
          cp -r modules/gestion_documentaire drupal-test/web/modules/custom/
          cp -r modules/entity_revision      drupal-test/web/modules/custom/

      # Installe Drupal avec SQLite (pas besoin de MySQL)
      - name: Install Drupal (SQLite)
        working-directory: drupal-test
        run: |
          vendor/bin/drush site:install minimal \
            --db-url="sqlite://sites/default/files/.sqlite" \
            --site-name="GYS CI" \
            --account-name=admin \
            --account-pass=admin \
            --no-interaction \
            --yes

      # Active les modules et vérifie qu'il n'y a pas d'erreur
      - name: Enable custom modules
        working-directory: drupal-test
        run: |
          vendor/bin/drush en gestion_documentaire entity_revision --yes
          vendor/bin/drush status
          vendor/bin/drush watchdog:show --count=20 --severity=Error || true

  sonarcloud:
    name: "SonarCloud"
    runs-on: ubuntu-22.04
    needs: [phpunit, benchmark, phpcs, drupal-integration]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download PHPCS report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phpcs-report
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
