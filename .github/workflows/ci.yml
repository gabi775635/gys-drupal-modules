name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    name: "PHPUnit"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  benchmark:
    name: "Performance benchmarks"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          extensions: mbstring

      # Télécharge la baseline de la branche principale (si elle existe)
      - name: Download baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: perf-baseline
          path: tests/perf/
        continue-on-error: true

      - name: Run benchmarks
        run: php -d error_reporting=E_ERROR tests/benchmark.php --compare

      - name: Save baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        run: php -d error_reporting=E_ERROR tests/benchmark.php --baseline

      - name: Upload baseline artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-baseline
          path: tests/perf/baseline.json
          retention-days: 90

  phpcs:
    name: "PHPCS Drupal"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml, curl

      - name: Install Drupal Coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require drupal/coder squizlabs/php_codesniffer
          ~/.composer/vendor/bin/phpcs --config-set installed_paths ~/.composer/vendor/drupal/coder/coder_sniffer

      - name: Run PHPCS
        run: |
          ~/.composer/vendor/bin/phpcs \
            --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install \
            --report=checkstyle \
            --report-file=phpcs-report.xml \
            modules/ || true
          # Crée un rapport vide si aucun fichier scanné
          if [ ! -f phpcs-report.xml ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><checkstyle version="3.5.8"></checkstyle>' > phpcs-report.xml
          fi

      - name: Upload PHPCS report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phpcs-report
          path: phpcs-report.xml

  sonarcloud:
    name: "SonarCloud"
    runs-on: ubuntu-22.04
    needs: [phpunit, benchmark, phpcs]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download PHPCS report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phpcs-report
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
