name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpcs:
    name: "PHPCS Drupal"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          extensions: mbstring, xml, curl

      - name: Install Drupal Coder
        run: |
          composer global require drupal/coder squizlabs/php_codesniffer
          ~/.composer/vendor/bin/phpcs --config-set installed_paths ~/.composer/vendor/drupal/coder/coder_sniffer

      - name: Run PHPCS
        run: |
          ~/.composer/vendor/bin/phpcs \
            --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install \
            --report=checkstyle \
            --report-file=phpcs-report.xml \
            modules/ || true

      - name: Upload PHPCS report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpcs-report
          path: phpcs-report.xml

  sonarcloud:
    name: "SonarCloud"
    runs-on: ubuntu-22.04
    needs: phpcs
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PHPCS report
        uses: actions/download-artifact@v4
        with:
          name: phpcs-report
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
