# ============================================
# SonarCloud - Configuration Projet GYS Drupal
# ============================================

# Identifiants du projet SonarCloud
# À créer sur https://sonarcloud.io avec votre compte GitHub
sonar.projectKey=GYS_drupal-modules
sonar.organization=gabriel-domergue

# Métadonnées
sonar.projectName=GYS - Modules Drupal (Gestion Documentaire)
sonar.projectVersion=1.0

# Répertoires sources à analyser
sonar.sources=modules/gestion_documentaire/src,modules/entity_revision
sonar.exclusions=\
  modules/gestion_documentaire/css/**,\
  modules/gestion_documentaire/js/**,\
  modules/gestion_documentaire/templates/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/vendor/**,\
  **/node_modules/**

# Langue principale
sonar.language=php
sonar.php.version=8.1

# Encodage des fichiers
sonar.sourceEncoding=UTF-8

# ─── Couverture de code (PHPUnit) ───────────
# Décommentez si vous avez généré un coverage.xml
# sonar.php.coverage.reportPaths=coverage.xml

# ─── Rapports PHPCS / CheckStyle ────────────
sonar.php.phpcs.reportPaths=phpcs-report-gestion.xml,phpcs-report-entity.xml

# ─── Rapport PHPUnit (tests) ────────────────
# sonar.testExecutionReportPaths=test-results.xml

# ─── Seuils de qualité (Quality Gate) ───────
# Ces seuils sont configurables dans l'interface SonarCloud
# Recommandé pour votre M3.2 :
#   - Coverage >= 30%
#   - Duplications <= 3%
#   - Maintainability Rating >= B
#   - Reliability Rating >= A
#   - Security Rating >= A

# ─── Branches ────────────────────────────────
# SonarCloud analyse automatiquement main et les PRs
# avec le token SONAR_TOKEN dans GitHub Secrets
